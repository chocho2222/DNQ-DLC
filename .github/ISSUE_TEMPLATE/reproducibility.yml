name: Reproducibility report
description: Report a mismatch with a published result
title: "[Reproducibility]: "
labels: ["reproducibility"]
body:
  - type: dropdown
    id: experiment
    attributes:
      label: Experiment
      options:
        - E1 primary endpoint
        - Closed-loop example
        - DLC checkpoint sensitivity
        - Figure or table
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected result
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Exact protocol
      description: Include commit, command, config, seeds and environment.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Non-sensitive logs or checksums
